name: Verify Medi Bud
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: medibud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pip install -r services/api/requirements.lock
      - run: pnpm build:web
      - run: pnpm build:mobile
      - run: pnpm --filter @medi-bud/mobile exec expo install --check
      - run: pnpm test:contracts
      - run: pnpm test:mobile
      - run: pnpm test:web
      - run: python -m pytest tests/integration tests/demo -q
      - run: python -m pytest tests/integration -q
        env:
          DATABASE_URL: postgresql://postgres:test_only_password@localhost:5432/medibud_test
      - run: python -c "import psycopg; c=psycopg.connect('postgresql://postgres:test_only_password@localhost:5432/postgres',autocommit=True); c.execute('CREATE DATABASE medibud_security_test'); c.close()"
      - run: python -m pytest tests/security -q
        env:
          SECURITY_TEST_DATABASE_URL: postgresql://postgres:test_only_password@localhost:5432/medibud_security_test
